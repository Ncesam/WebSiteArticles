syntax = "proto3";

package generator;

option go_package = "generated/proto/generator;generatorpb";

message GenerateRequest {
  string Model       = 1;
  string text = 2;
  int32 TextLength   = 3;
}

message GenerateResponse {
  string Result = 1;
}

service GeneratorService {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
}
