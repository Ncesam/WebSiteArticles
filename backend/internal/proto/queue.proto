syntax = "proto3";

package queue;

option go_package = "generated/proto/queue;queuepb";

message Article {
  string Title = 2;
  repeated Block Blocks = 3;
}

message Block {
  string Type = 1;
  BlockData Data = 2;
}
message BlockData {
  string Text = 1;
  string Lang = 2;
  repeated string Items = 3;
  string Type = 4;
}

message startConfigRequest {
  int64 configId = 1;
  int64 userId = 2;
  string prompt = 3;
  string data = 4;
}

message Empty {}

service QueueService {
  rpc StartConfig(startConfigRequest) returns (Empty);
}
