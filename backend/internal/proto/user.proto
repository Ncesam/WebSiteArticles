syntax = "proto3";

package user;

option go_package = "generated/proto/user;userpb";

message Response { int64 status = 1; }

message AddUserRequest {
  string email = 1;
  string nickname = 2;
  string password = 3;
}

message GetUserRequest { string nickname = 1; }

message UpdateUserRequest {
  int64 id = 1;
  string email = 2;
  string nickname = 3;
  string password = 4;
}

message DeleteUserRequest { int64 id = 1; }

message User {
  int64 id = 1;
  string email = 2;
  string nickname = 3;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc AddUser(AddUserRequest) returns (Response);
  rpc UpdateUser(UpdateUserRequest) returns (Response);
  rpc DeleteUser(DeleteUserRequest) returns (Response);
}