syntax = "proto3";

package user;

message Response {
  int32 status = 1;
}

message AddUserRequest {
  string email = 1;
  string nickname = 2;
  string password = 3;
  bool isAdmin = 4;
}

message GetUserRequest {
  string nickname = 1;
}

message UpdateUserRequest {
  int32 id = 1;
  string email = 2;
  string nickname = 3;
  string password = 4;
  bool isAdmin = 5;
}

message DeleteUserRequest {
  int32 id = 1;
}

message User {
  int32 id = 1;
  string email = 2;
  string nickname = 3;
  bool isAdmin = 4;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc AddUser(AddUserRequest) returns (Response);
  rpc UpdateUser(UpdateUserRequest) returns (Response);
  rpc DeleteUser(DeleteUserRequest) returns (Response);
}