version: '3.9'

services:
  postgresdb:
    image: postgres:15-alpine
    container_name: postgresdb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: JVl2kF
      POSTGRES_DB: API
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: JVl2kF
    networks:
      - backend_net

  auth:
    build:
      context: ./backend
      dockerfile: deploy/auth/Dockerfile
    container_name: auth_service
    depends_on:
      - postgresdb
    ports:
      - "50001"
    networks:
      - backend_net

  config:
    build:
      context: ./backend
      dockerfile: deploy/config/Dockerfile
    container_name: config_service
    depends_on:
      - mongo
    ports:
      - "50002"
    networks:
      - backend_net

  queue:
    build:
      context: ./backend
      dockerfile: deploy/queue/Dockerfile
    container_name: queue_service
    ports:
      - "50003"
    networks:
      - backend_net

  request:
    build:
      context: ./backend
      dockerfile: deploy/request/Dockerfile
    container_name: request_service
    ports:
      - "50004"
    networks:
      - backend_net

  gateway:
    build:
      context: ./backend
      dockerfile: deploy/gateway/Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth
      - config 
      - queue
      - request
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - frontend_net

volumes:
  postgres_data:
  mongo_data:

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge